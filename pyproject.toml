[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sshlog-analyzer"
version = "0.4.0"
description = "Offline defensive SSH and web-server log analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
    "matplotlib==3.11.2",
    "streamlit==1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "coverage==7.10.6",
    "ruff==0.14.10",
]

[project.scripts]
sshlog-analyzer = "analyzer:main"

[tool.setuptools]
py-modules = [
    "analyzer",
    "benchmark",
    "config",
    "dashboard",
    "detections",
    "html_report",
    "ssh_parser",
    "web_detections",
    "web_parser",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
